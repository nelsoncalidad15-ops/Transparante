<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <!-- Volkswagen Round Emblem (Navy Blue) -->
  <g transform="translate(10, 10)">
    <!-- Outer circle ring -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#0B2265" stroke-width="7" />
    <circle cx="50" cy="50" r="40" fill="none" stroke="#0B2265" stroke-width="2.5" />
    
    <!-- VW Lettering inner structure -->
    <!-- Top V lines -->
    <path d="M 28 26 L 44 65 L 56 65 L 72 26" fill="none" stroke="#0B2265" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom W lines -->
    <path d="M 23 48 L 41 85 L 50 67 L 59 85 L 77 48" fill="none" stroke="#0B2265" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 37 49 L 50 24 L 63 49" fill="none" stroke="#0B2265" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="125" y1="20" x2="125" y2="100" stroke="#0B2265" stroke-width="6" stroke-linecap="round" />

  <!-- Autosol Wordmark Text in Official Geometric Bold Navy -->
  <g transform="translate(150, 78)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="64" fill="#0B2265" letter-spacing="-1.5px">
      Autosol
    </text>
  </g>
</svg>
